# Publishes the browser version (web/) to GitHub Pages: static files only, no server.
# One-off setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: web
        run: npm ci && npm test
      - name: Assemble the public files only (no server, tests or fixtures)
        run: |
          mkdir _site
          cd web
          cp -r index.html style.css main.js worker.js vod-provider.js lib data assets vendor animation ../_site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
