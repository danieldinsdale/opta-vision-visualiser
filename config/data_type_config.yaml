# Rendering style per tracking source.
#   facecolor_fill : filled (true) or outline-only (false) markers
#   linestyle      : "-" solid, "--" dashed, ":" dotted
#   alpha          : 0.0 - 1.0 opacity
# The first loaded tracking file uses the `epts` entry; additional files are
# given automatically distinguishable styles (see config.py).
epts:
  label_name: "EPTS"
  facecolor_fill: true
  linestyle: "-"
  alpha: 0.9
  fontsize: 10
  player_number_prefix: ""
  player_number_suffix: ""
